# ============================================================
#  酷狗 .kgg 转换工具 · 目录设置
# ============================================================
#  改完保存即可，回到网页界面点「重新读取配置」（或刷新页面）就生效。
#
#  留空 = 使用程序内置的默认路径，也就是：
#    输入目录  <项目目录>\input
#    输出目录  <项目目录>\output
#
#  ★ 想让整个项目文件夹搬到哪里都能用：留空即可，或者写相对路径：
#      inputDir=input
#      outputDir=output
#    相对路径是相对**项目目录**的，项目整体搬家/复制都不会失效。
#    只有写到项目外面的绝对路径（例如 D:\KuGou\KugouMusic）才依赖盘符位置。
#    界面上改目录时，如果选的是项目内的目录，会自动存成相对路径。
#
#  路径写法很宽松，下面这些都能认：
#    D:\KuGou\KugouMusic
#    D:/KuGou/KugouMusic
#    D:\\KuGou\\KugouMusic
#    "D:\KuGou\KugouMusic"
#    %USERPROFILE%\Music\kgg
#    input                       （相对项目目录）
#    ..\素材\kgg                 （相对项目目录，可以往上走）
#
#  目录必须真实存在，否则网页界面会提示，转换也会失败。
#  本文件可以放心删除：下次启动会自动重新生成，并回退到默认路径。
# ============================================================

inputDir=D:\KuGou\KugouMusic
outputDir=D:\Music
